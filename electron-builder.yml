appId: com.ialfaro.tokio
productName: Tokio
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
# NOTE: Required by the AGPL-3.0/LGPL-3.0 notices in THIRD_PARTY_NOTICES.md, keep these in the installed app.
extraResources:
  - from: LICENSE
    to: licenses/LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: LICENSES
    to: licenses/LICENSES
win:
  executableName: tokio
  icon: "build/icon.png"
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# NOTE: The website (tokio-web, src/lib/release.ts) finds these artifacts on the latest GitHub release
# by these names, and build-app.yml uploads them by these names. Keep them in sync.
mac:
  icon: "build/icon.png"
  # Ad-hoc signature, so Apple Silicon runs the app without a certificate. Replace with a Developer ID
  # (and notarization) to avoid Gatekeeper warnings.
  identity: "-"
  hardenedRuntime: false
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  target:
    - target: zip
      arch: [x64, arm64]
linux:
  executableName: tokio
  icon: "build/icon.png"
  category: AudioVideo
  target:
    - target: AppImage
      arch: [x64]
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
# Auto-update metadata (latest*.yml) points at the GitHub releases, where release.yml uploads the builds.
publish:
  provider: github
  owner: tokio-app
  repo: tokio
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
