appId: com.ialfaro.tokio
productName: Tokio
directories:
  buildResources: build
# Only what the app runs. electron-builder adds package.json and the production dependencies on its own,
# and the license files go in through extraResources, so nothing else from the repo ships.
files:
  - "out/**/*"
  - "music-out/**/*"
  - "resources/**/*"
asarUnpack:
  - resources/**
# NOTE: Required by the AGPL-3.0/LGPL-3.0 notices in THIRD_PARTY_NOTICES.md, keep these in the installed app.
extraResources:
  - from: LICENSE
    to: licenses/LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: LICENSES
    to: licenses/LICENSES
win:
  executableName: tokio
  icon: "build/icon.png"
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# NOTE: The website (tokio-web, src/lib/release.ts) finds these artifacts on the latest GitHub release
# by these names, and build-app.yml uploads them by these names. Keep them in sync.
mac:
  icon: "build/icon.png"
  # Ad-hoc signature, so Apple Silicon runs the app without a certificate. Replace with a Developer ID
  # (and notarization) to avoid Gatekeeper warnings.
  identity: "-"
  hardenedRuntime: false
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  target:
    - target: zip
      arch: [x64, arm64]
linux:
  executableName: tokio
  icon: "build/icon.png"
  category: AudioVideo
  target:
    - target: AppImage
      arch: [x64]
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
# Auto-update metadata (latest*.yml) points at the GitHub releases, where release.yml uploads the builds.
publish:
  provider: github
  owner: tokio-app
  repo: tokio
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
