name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install packages
        run: yarn install --frozen-lockfile

      - name: Format
        if: runner.os == 'Linux'
        run: npx prettier --check .

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

  # Builds the app and runs it with Playwright, see e2e/.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install packages
        run: yarn install --frozen-lockfile

      # Electron needs a display, which the Linux runner doesn't have
      - name: End-to-end tests
        if: runner.os == 'Linux'
        run: xvfb-run -a yarn test:e2e

      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: yarn test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  # Packaged builds run on pushes and ready PRs. Draft PRs only get the checks, unless the
  # latest commit message contains [ci] (see .github/pull_request_template.md). Release commits
  # (chore(release): ...) skip them: their tag runs release.yml, which packages the same commit.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PUSHED_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = "push" ] && [[ "$PUSHED_MESSAGE" == "chore(release)"* ]]; then
            build=false
          elif [ "$EVENT" != "pull_request" ] || [ "$DRAFT" != "true" ]; then
            build=true
          elif git log -1 --format=%B | grep -qF "[ci]"; then
            build=true
          else
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: [checks, gate]
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/build-app.yml
