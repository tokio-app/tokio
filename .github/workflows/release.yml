name: Release

# Push a tag v<version> matching package.json to build every platform and publish a GitHub release.
# It becomes the latest release, which auto-updates and the website read, and the website rebuilds.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version."
            exit 1
          fi

  app:
    needs: verify
    uses: ./.github/workflows/build-app.yml

  release:
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags for the notes

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Lists the commits since the previous v* tag, grouped by Conventional Commits type.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-notes/index.js "$GITHUB_REF_NAME" > release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l assets
          # A rerun only replaces the files, so notes already edited in the release are kept.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          else
            # gh uploads the files before publishing, so the update files are there when
            # auto-updates see it. Alphas (0.1.0-alpha.5) aren't marked as prereleases: the
            # updater and the website only read the latest release.
            gh release create "$GITHUB_REF_NAME" assets/* --verify-tag \
              --title "Tokio ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi

      # Rebuilds the website, so its download page shows the new version.
      - name: Update the website
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::WEBSITE_DISPATCH_TOKEN isn't set, so the website wasn't rebuilt. Run its Deploy workflow by hand."
            exit 0
          fi
          gh api repos/tokio-app/website/dispatches -f event_type=release
