name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["bug"]
assignees:
  - akuqt
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tokio version
      description: Shown on the About page.
      placeholder: e.g. 0.1.0-alpha.8
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
  - type: upload
    id: logs
    attributes:
      label: Upload relevant logs
      description: Attach the files from the `logs` folder in `.tokio` in your home folder (e.g. `C:\Users\<you>\.tokio\logs`). They include your TikTok username.
    validations:
      required: false
