<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tokio alert</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      img,
      video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      @media (prefers-reduced-motion: no-preference) {
        img,
        video {
          animation: show 0.3s ease-out;
        }
      }

      @keyframes show {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
      }
    </style>
  </head>
  <body>
    <script>
      // One alert's overlay, at /alerts/<alert id>/. It shows the image or
      // video main sends when the alert's turn comes (AlertsService.showMedia).
      const id = decodeURIComponent(location.pathname.split("/")[2] ?? "");
      let current = null;

      // Only while it's the one on screen, a newer one stays.
      const hide = (el) => {
        if (el !== current) return;
        el.remove();
        current = null;
      };

      const show = ({ src, kind, duration, volume }) => {
        current?.remove();
        const el = document.createElement(kind === "video" ? "video" : "img");
        current = el;
        el.onerror = () => hide(el);
        el.src = src;
        document.body.append(el);
        setTimeout(() => hide(el), duration * 1000);
        if (kind !== "video") return;

        el.volume = volume / 100;
        el.onended = () => hide(el);
        // A browser may refuse sound before a click, OBS doesn't.
        el.play()
          .catch(() => {
            el.muted = true;
            return el.play();
          })
          .catch(() => {});
      };

      const connect = () => {
        const socket = new WebSocket(
          `ws://${location.host}/?id=${encodeURIComponent(id)}`,
        );
        // Every overlay gets the LIVE's events too, this one ignores them.
        socket.onmessage = (event) => {
          const { type, data } = JSON.parse(event.data);
          if (type === "tokio:alert:media") show(data);
          else if (type === "tokio:alert:clear" && current) hide(current);
        };
        socket.onclose = () => setTimeout(connect, 2000);
      };
      connect();
    </script>
  </body>
</html>
