<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tokio studio overlay</title>
    <style>
      /* Inlined by ServerService, so every streaming app gets it */
      @font-face {
        font-family: "Archivo Variable";
        font-style: normal;
        font-display: block;
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url(__ARCHIVO__) format("woff2-variations");
      }

      html,
      body,
      #stage {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      /* __STYLES__ */
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      /* __STAGE__ */
    </script>
    <script>
      // One Overlay Studio overlay, at /studio/<overlay id>/. Main sends what
      // to draw (tokio:studio) and each element's reaction to the LIVE
      // (tokio:studio:react); the stage draws them, scaled to the source.
      const id = decodeURIComponent(location.pathname.split("/")[2] ?? "");
      const stage = TokioStage.createStage(document.getElementById("stage"), {
        slots: false,
        editing: false,
      });

      const connect = () => {
        const socket = new WebSocket(
          `ws://${location.host}/?id=${encodeURIComponent(`studio:${id}`)}`,
        );
        // Every overlay gets the LIVE's events too, this one ignores them.
        socket.onmessage = (event) => {
          const { type, data } = JSON.parse(event.data);
          if (type === "tokio:studio") stage.update(data.view);
          else if (type === "tokio:studio:react") stage.react(data);
        };
        socket.onclose = () => setTimeout(connect, 2000);
      };
      connect();
    </script>
  </body>
</html>
