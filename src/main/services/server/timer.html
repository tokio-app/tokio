<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tokio countdown</title>
    <style>
      /* Inlined by ServerService, so every streaming app gets it */
      @font-face {
        font-family: "Archivo Variable";
        font-style: normal;
        font-display: block;
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url(__ARCHIVO__) format("woff2-variations");
      }

      :root {
        --clock: #f1f5f9;
        --title: #f1f5f9;
        --accent: #f43f5e;
        --warning: #f43f5e;
        /* Keeps the text legible over bright video */
        --halo: rgb(18 18 18 / 55%);
        /* The clock fills the browser source, the rest follows it. --fit
           shrinks it when a font is too wide for the source (fit below). */
        --size: calc(min(26vw, 46vh) * var(--fit, 1));
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Archivo Variable", sans-serif;
        line-height: 1.1;
      }

      /* The rows, measured together to fit the source (fit below) */
      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* On each text: set on body, its em would be the body's 16px */
      .title,
      .clock,
      .slot,
      .carousel {
        text-shadow:
          0 0 0.05em var(--halo),
          0 0.02em 0.12em var(--halo),
          0 0 0.4em rgb(18 18 18 / 30%);
      }

      /* Wraps instead of clipping, which would cut its halo into a box */
      .title {
        max-width: 94vw;
        margin-bottom: 0.15em;
        font-size: calc(var(--size) * 0.34);
        font-weight: 600;
        color: var(--title);
        text-align: center;
        text-wrap: balance;
        overflow-wrap: anywhere;
      }

      .clock,
      .slot {
        font-weight: 800;
        font-stretch: 75%;
        font-variant-numeric: tabular-nums;
      }

      .clock {
        font-size: var(--size);
        color: var(--clock);
        transition:
          opacity 0.3s,
          color 0.3s;
      }

      .clock.dim {
        opacity: 0.55;
      }

      .clock.warn {
        color: var(--warning);
      }

      /* Always there, so nothing shifts when it fills */
      .slot {
        height: 1.1em;
        font-size: calc(var(--size) * 0.4);
        color: var(--accent);
      }

      .slot.removed {
        color: var(--clock);
      }

      .slot.change {
        animation: rise 1.5s ease-out forwards;
      }

      /* One trigger at a time, on one line. The padding gives its halo room
         inside the box that cuts a long name short; the margins take it back. */
      .carousel {
        max-width: 94vw;
        margin: -0.4em 0;
        padding: 0.4em;
        overflow: hidden;
        font-size: calc(var(--size) * 0.3);
        font-weight: 600;
        color: var(--title);
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .carousel b {
        margin-left: 0.3em;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }

      .carousel.turn {
        animation: turn 0.5s ease-out;
      }

      @keyframes turn {
        from {
          opacity: 0;
          transform: translateY(0.4em);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(0.2em);
        }
        12% {
          opacity: 1;
          transform: none;
        }
        70% {
          opacity: 1;
        }
        to {
          opacity: 0;
          transform: translateY(-0.4em);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .slot.change {
          animation-name: fade;
        }

        .carousel.turn {
          animation-name: fade-in;
        }
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
        12%,
        70% {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="stack" id="stack">
      <div class="title" id="title" hidden></div>
      <div class="clock dim" id="clock" role="timer"></div>
      <div class="slot" id="slot"></div>
      <div class="carousel" id="carousel" hidden></div>
    </main>
    <script>
      // The countdown timer's overlay, at /timer/. Main sends its state on
      // connect and on every change (registerTimer in init.ts).
      const stack = document.getElementById("stack");
      const title = document.getElementById("title");
      const clock = document.getElementById("clock");
      const slot = document.getElementById("slot");
      const carousel = document.getElementById("carousel");
      const LABEL_MS = 1500;
      // How long the carousel shows each trigger
      const TURN_MS = 3000;
      // The carousel's triggers, and the one it shows
      let triggers = [];
      let turn = 0;
      // The last state, its remaining as of `at`
      let state = null;
      let at = 0;
      // Time changed in the last LABEL_MS, whether the slot shows it instead
      // of ×N, and when it's forgotten
      let sum = 0;
      let showing = false;
      let forget = null;

      const pad = (n) => String(n).padStart(2, "0");
      const hms = (s) => [
        Math.floor(s / 3600),
        Math.floor((s % 3600) / 60),
        s % 60,
      ];

      // 01:59:42, rounded up so 0 shows only at the end
      const clockText = (ms) =>
        hms(Math.max(0, Math.ceil(ms / 1000)))
          .map(pad)
          .join(":");

      // +5s, +0.5s, +1:30, +1:00:00, or −5:00 when removed, as formatAdded
      // (src/common/util/timer.ts) writes it
      const changeText = (ms) => {
        const seconds = Math.abs(ms) / 1000;
        const total = Math.round(seconds);
        const [h, m, s] = hms(total);
        const text =
          seconds < 10
            ? `${Math.round(seconds * 10) / 10}s`
            : total < 60
              ? `${total}s`
              : h > 0
                ? `${h}:${pad(m)}:${pad(s)}`
                : `${m}:${pad(s)}`;
        return (ms < 0 ? "−" : "+") + text;
      };

      const left = () =>
        state.status === "running"
          ? state.remaining - (performance.now() - at)
          : state.remaining;

      const draw = () => {
        if (!state) return;
        const ms = left();
        const running = state.status === "running";
        const warnAt = state.look.warn_at * 60_000;
        clock.textContent = clockText(ms);
        clock.classList.toggle("dim", !running);
        clock.classList.toggle("warn", running && warnAt > 0 && ms <= warnAt);
      };

      // One CSS property, so a font's name can't inject anything
      const setFont = (el, font) => {
        const name = font.trim();
        el.style.fontFamily = name
          ? `${JSON.stringify(name)}, "Archivo Variable", sans-serif`
          : "";
      };

      const showMultiplier = () => {
        const { multiplier, look } = state;
        slot.className = "slot";
        slot.textContent =
          look.show_multiplier && multiplier !== 1
            ? `×${+multiplier.toFixed(2)}`
            : "";
      };

      // Changes while the label shows add up into it and restart it. A sum
      // that rounds to under a second shows ×N meanwhile, as on Tools.
      const showChange = (ms) => {
        sum += ms;
        clearTimeout(forget);
        forget = setTimeout(() => {
          sum = 0;
          showing = false;
          showMultiplier();
        }, LABEL_MS);
        showing = Math.round(Math.abs(sum) / 1000) >= 1;
        if (!showing) return showMultiplier();
        slot.textContent = changeText(sum);
        slot.className = "slot";
        // Restarts the animation
        void slot.offsetWidth;
        slot.className = sum < 0 ? "slot change removed" : "slot change";
      };

      // A trigger's name in the title's color, and the time it adds in the
      // accent color. Text only, so a name can't add markup.
      const showTrigger = (animate) => {
        const item = triggers[turn];
        if (!item) return;
        const name = document.createElement("span");
        const value = document.createElement("b");
        name.textContent = item.label;
        value.textContent = item.value;
        carousel.replaceChildren(name, value);
        if (!animate) return;
        carousel.classList.remove("turn");
        void carousel.offsetWidth;
        carousel.classList.add("turn");
      };
      setInterval(() => {
        if (triggers.length < 2) return;
        turn = (turn + 1) % triggers.length;
        showTrigger(true);
      }, TURN_MS);

      const update = (data) => {
        state = data;
        at = performance.now();
        const { look } = data;
        const root = document.documentElement.style;
        root.setProperty("--clock", look.clock_color);
        root.setProperty("--title", look.title_color);
        root.setProperty("--accent", look.accent_color);
        root.setProperty("--warning", look.warning_color);
        const text = look.title.trim();
        title.hidden = !text;
        title.textContent = text;
        setFont(title, look.title_font);
        setFont(clock, look.clock_font);
        setFont(slot, look.clock_font);
        setFont(carousel, look.title_font);
        if (!showing) showMultiplier();
        if (data.added) showChange(data.added);
        // Only when the triggers changed, so pushes don't restart the turns
        const next = data.triggers ?? [];
        if (JSON.stringify(next) !== JSON.stringify(triggers)) {
          triggers = next;
          turn = turn < triggers.length ? turn : 0;
          carousel.hidden = triggers.length === 0;
          showTrigger(false);
        }
        draw();
        fit();
      };
      setInterval(draw, 250);

      // A font too wide for the source, or a title on two lines, shrinks
      // everything until it all fits
      const fit = () => {
        const root = document.documentElement.style;
        root.setProperty("--fit", "1");
        const width = clock.scrollWidth;
        const height = stack.offsetHeight;
        if (width && height) {
          const scale = Math.min(
            1,
            (innerWidth * 0.94) / width,
            (innerHeight * 0.94) / height,
          );
          root.setProperty("--fit", String(scale));
        }
      };
      addEventListener("resize", fit);
      // The fonts' widths are known once they've loaded
      document.fonts?.ready.then(fit);

      const connect = () => {
        const socket = new WebSocket(`ws://${location.host}/?id=timer`);
        // Every overlay gets the LIVE's events too, this one ignores them.
        socket.onmessage = (event) => {
          const { type, data } = JSON.parse(event.data);
          if (type === "tokio:timer") update(data);
        };
        socket.onclose = () => setTimeout(connect, 2000);
      };
      connect();
    </script>
  </body>
</html>
